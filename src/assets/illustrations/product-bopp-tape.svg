<title id="t">Rolls of BOPP packing tape in brown, clear and printed FRAGILE</title>
<desc id="d">BOPP self-adhesive packing tape rolls on 3-inch cardboard cores, brown, clear and printed FRAGILE, with loose ends pulled out, beside a corrugated carton sealed with brown tape.</desc>
