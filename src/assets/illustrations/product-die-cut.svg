<title id="t">Die-cut corrugated mailer box with its flat die-cut blank</title>
<desc id="d">A die-cut mailer box (FEFCO 0427 style) open with a white inner liner, tissue and a printed thank-you inside the lid, beside two closed mailers and the flat die-cut blank it folds from, with its crease lines and dust flaps.</desc>
